name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.kver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - kver: "5.10"
            cfg: configs/wt6285.config
            extra: ""
          - kver: "6.18"
            cfg: configs/wt6285-6.18.config
            extra: "CONFIG_TESTING_KERNEL=y"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: dl-${{ matrix.kver }}-${{ hashFiles('upstream.lock', 'configs/**') }}
          restore-keys: |
            dl-${{ matrix.kver }}-${{ hashFiles('upstream.lock') }}-
            dl-${{ matrix.kver }}-

      - name: Clone lean at pinned commit
        run: |
          for i in 1 2 3; do
            rm -rf lede
            if git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede; then
              break
            fi
            echo "clone failed, retry $i"
            sleep 15
          done
          cd lede
          TARGET_SHA="$(cat ../upstream.lock)"
          if ! git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null; then
            git fetch --depth 1 origin "$TARGET_SHA" || git fetch origin "$TARGET_SHA"
          fi
          git checkout "$TARGET_SHA"
          echo "LEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply defconfig
        run: |
          cd lede
          cp "../${{ matrix.cfg }}" .config
          if [ -n "${{ matrix.extra }}" ]; then echo "${{ matrix.extra }}" >> .config; fi
          make defconfig

      - name: Apply rootfs overlay
        run: |
          cd lede
          if [ -d ../files ] && [ -n "$(ls -A ../files 2>/dev/null | grep -v README.md)" ]; then
            cp -a ../files/. package/base-files/files/
          fi

      - name: Copy custom packages
        run: |
          cd lede
          for d in ../package/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            echo "adding package: $name"
            rm -rf "package/$name"
            cp -a "$d" "package/$name"
          done
          ls package | grep -E 'lpac|quectel|wt6285'

      - name: Build firmware
        run: |
          cd lede
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        run: |
          cd lede
          mkdir -p ../out
          find bin/targets/ramips/mt76x8 -maxdepth 1 -name '*sysupgrade.bin' -exec cp {} ../out/ \;
          cd ../out
          for f in *.bin; do
            mv "$f" "wt6285-${{ matrix.kver }}-${LEAN_SHA:0:7}-${f}"
          done
          {
            echo "lean_sha=${LEAN_SHA}"
            echo "kernel=${{ matrix.kver }}"
            echo "built_at=$(date -u +%FT%TZ)"
            echo "runner=${ImageOS}"
          } > buildinfo.txt
          ls -lh
          sha256sum * > SHA256SUMS.txt

      - name: Check image size
        run: |
          cd out
          MAX=$((15808*1024))
          for f in *.bin; do
            s=$(stat -c%s "$f")
            echo "$f = $s bytes (limit $MAX)"
            [ "$s" -le "$MAX" ] || { echo "::error::$f exceeds flash size"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wt6285-${{ matrix.kver }}
          path: |
            out/*.bin
            out/SHA256SUMS.txt
            out/buildinfo.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.bin
            out/SHA256SUMS.txt
            out/buildinfo.txt

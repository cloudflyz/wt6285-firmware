name: build

on:
  workflow_dispatch:
    inputs:
      cfg:
        description: "Config file"
        type: choice
        options: [configs/wt6285-lite.config, configs/wt6285.config, configs/wt6285-qmi.config, configs/wt6285-uqmi.config]
        default: configs/wt6285-lite.config
      slim_i18n:
        description: "精简 luci-i18n 翻译包（体积优化）"
        type: boolean
        default: false
      ssh:
        description: "开启 tmate SSH 调试（仅仓库所有者）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: build-${{ matrix.kver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # tag 构建默认出 eSIM 版；日常配置无更新时不必重出，需要时手跑 dispatch 选它
          - kver: "5.10"
            cfg: ${{ inputs.cfg || 'configs/wt6285-esim.config' }}
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: SSH debug (tmate)
        if: inputs.ssh == true && github.actor == github.repository_owner
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: dl-${{ matrix.kver }}-${{ hashFiles('upstream.lock') }}
          restore-keys: |
            dl-${{ matrix.kver }}-${{ hashFiles('upstream.lock') }}-
            dl-${{ matrix.kver }}-

      # 工具链缓存：键跟 lean 提交与配置走，源码不变就命中
      - name: Cache toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: |
            lede/staging_dir/host
            lede/staging_dir/hostpkg
            lede/staging_dir/toolchain-*
          key: ${{ format('{0}-{1}-{2}', 'wt6285', 'toolchain', matrix.kver) }}-${{ hashFiles('upstream.lock') }}
          restore-keys: |
            ${{ format('{0}-{1}-', 'wt6285', 'toolchain') }}

      # build_dir 里的 gcc 编译目录单独缓存：
      # 只恢复 staging_dir 时 OpenWrt 仍会重编工具链，必须连 build_dir 一起
      - name: Cache toolchain build dir
        id: tcb
        uses: actions/cache@v4
        with:
          path: lede/build_dir/toolchain-*
          key: ${{ format('{0}-{1}-{2}', 'wt6285', 'toolchain-build', matrix.kver) }}-${{ hashFiles('upstream.lock') }}

      - name: Report toolchain cache
        run: |
          if [ "${{ steps.tc.outputs.cache-hit }}" = "true" ]; then
            echo "工具链缓存命中，跳过工具链编译" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "工具链缓存未命中，本次完整编译工具链" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clone lean at pinned commit
        run: |
          for i in 1 2 3; do
            rm -rf lede
            if git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede; then
              break
            fi
            echo "clone failed, retry $i"
            sleep 15
          done
          cd lede
          TARGET_SHA="$(cat ../upstream.lock)"
          if ! git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null; then
            git fetch --depth 1 origin "$TARGET_SHA" || git fetch origin "$TARGET_SHA"
          fi
          git checkout "$TARGET_SHA"
          echo "LEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # 把各 feed 钉到 feeds.conf 里记录的提交，避免上游变动
      - name: Pin feeds
        run: |
          cp feeds.conf lede/feeds.conf.default
          echo "--- 钉住的 feed ---"
          grep -c '\^' lede/feeds.conf.default
          grep 'src-git' lede/feeds.conf.default

      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch download.pl timeouts
        run: |
          f=lede/scripts/download.pl
          if ! grep -q -- "--speed-time 45" "$f"; then
            sed -i "s|curl -f --connect-timeout 20 --retry 5 --location|curl -f --connect-timeout 20 --retry 3 --location --speed-limit 2048 --speed-time 45 --max-time 900|" "$f"
          fi
          grep -n "curl -f" "$f"

      - name: Copy custom packages
        run: |
          cd lede
          for d in ../package/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            echo "adding package: $name"
            rm -rf "package/$name"
            cp -a "$d" "package/$name"
          done
          ls package | grep -E 'lpac|quectel|wt6285'

      - name: Apply rootfs overlay
        run: |
          cd lede
          if [ -d ../files ] && [ -n "$(ls -A ../files 2>/dev/null | grep -v README.md)" ]; then
            cp -a ../files/. package/base-files/files/
          fi

      - name: Apply defconfig
        run: |
          cd lede
          cp "../${{ matrix.cfg }}" .config
          if [ -n "${{ matrix.extra }}" ]; then echo "${{ matrix.extra }}" >> .config; fi
          make defconfig
          echo "--- package assertions ---"
          REQUIRED="CONFIG_PACKAGE_quectel-cm-5g=y CONFIG_PACKAGE_luci-app-wt6285=y CONFIG_PACKAGE_sms-tool=y CONFIG_PACKAGE_luci-theme-vantage=y CONFIG_PACKAGE_luci-app-vantage=y CONFIG_PACKAGE_kmod-usb-acm=y"
          case "${{ matrix.cfg }}" in *esim*) REQUIRED="$REQUIRED CONFIG_PACKAGE_lpac=y" ;; esac
          for sym in $REQUIRED; do
            if grep -q "^$sym$" .config; then
              echo "OK $sym"
            else
              echo "::error::missing $sym"
              exit 1
            fi
          done
          echo "--- negative assertions ---"
          NEG="CONFIG_PACKAGE_luci-app-ssr-plus"
          case "${{ matrix.cfg }}" in *esim*) ;; *) NEG="$NEG CONFIG_PACKAGE_lpac" ;; esac
          for sym in $NEG; do
            if grep -q "^$sym=y$" .config; then
              echo "::error::unexpected $sym selected"
              exit 1
            fi
            echo "OK excluded $sym"
          done

      - name: Slim i18n packages
        if: inputs.slim_i18n == true
        run: |
          cd lede
          before=$(grep -cE '^CONFIG_PACKAGE_luci-i18n-[A-Za-z0-9_.-]+-zh-cn=(y|m)$' .config || true)
          sed -i -E 's/^(CONFIG_PACKAGE_luci-i18n-[A-Za-z0-9_.-]+-zh-cn)=(y|m)/# \1 is not set/' .config
          for p in luci-i18n-base-zh-cn; do
            sed -i "/^# CONFIG_PACKAGE_${p} is not set$/d" .config
            echo "CONFIG_PACKAGE_${p}=y" >> .config
          done
          after=$(grep -cE '^CONFIG_PACKAGE_luci-i18n-[A-Za-z0-9_.-]+-zh-cn=y$' .config || true)
          echo "zh-cn 翻译包: ${before} → ${after}" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '^CONFIG_PACKAGE_luci-base=y$' .config \
            || { echo "::error::luci-base 被误删，中止"; exit 1; }

      - name: Build firmware
        run: |
          cd lede
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        run: |
          cd lede
          mkdir -p ../out
          find bin/targets/ramips/mt76x8 -maxdepth 1 \( -name '*sysupgrade.bin' -o -name '*initramfs-kernel.bin' \) -exec cp {} ../out/ \;
          cd ../out
          for f in *.bin; do
            VARIANT=$(basename "${{ matrix.cfg }}" .config); VARIANT=${VARIANT#wt6285}; VARIANT=${VARIANT#-}; [ -n "$VARIANT" ] || VARIANT=daily
            mv "$f" "wt6285-${VARIANT}-${{ matrix.kver }}-${LEAN_SHA:0:7}-${f}"
          done
          {
            echo "lean_sha=${LEAN_SHA}"
            echo "kernel=${{ matrix.kver }}"
            echo "cfg=${{ matrix.cfg }}"
            echo "built_at=$(date -u +%FT%TZ)"
            echo "runner=${ImageOS}"
          } > buildinfo-${{ matrix.kver }}.txt
          ls -lh
          sha256sum *.bin buildinfo-${{ matrix.kver }}.txt > SHA256SUMS-${{ matrix.kver }}.txt

      - name: Check image size
        run: |
          cd out
          MAX=$((15808*1024))
          for f in *.bin; do
            s=$(stat -c%s "$f")
            echo "$f = $s bytes (limit $MAX)"
            [ "$s" -le "$MAX" ] || { echo "::error::$f exceeds flash size"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wt6285-${{ matrix.kver }}
          path: |
            out/*.bin
            out/SHA256SUMS-*.txt
            out/buildinfo-*.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.bin
            out/SHA256SUMS-*.txt
            out/buildinfo-*.txt

      # 只保留最近 3 个发布，其余连 tag 一起清理
      - name: Cleanup old releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=3
          mapfile -t TAGS < <(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          echo "现有 Release: ${TAGS[*]}"
          for i in "${!TAGS[@]}"; do
            if [ "$i" -lt "$KEEP" ]; then
              echo "保留: ${TAGS[$i]}"
            else
              echo "删除: ${TAGS[$i]}"
              gh release delete "${TAGS[$i]}" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes </dev/null || true
            fi
          done
